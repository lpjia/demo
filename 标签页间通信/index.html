    /* 对应第四种, 完全版, 频道方案 */
    const btns = document.querySelectorAll('.music-item i')
    const channel = new BroadcastChannel('music')
    for (const btn of btns) {
      btn.onclick = function () {
        const name = this.dataset.name
        if (newTabCount < 1) {
          window.open(`./music.html?name=${name}`, 'music')
        }
        else {
          channel.postMessage(name)
        }
      }
    }
    let newTabCount = 0 // 新开标签页的数量
    const newTabCountChannel = new BroadcastChannel('newTabCount')
    newTabCountChannel.addEventListener('message', (e) => {
      if (e.data === 1) {
        newTabCount++
      }
      else if (e.data === -1) {
        newTabCount--
      }
    })
