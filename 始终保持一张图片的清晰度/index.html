<!doctype html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>始终保持一张图片的清晰度</title>
  <style>
    img {
      width: 150px;
      height: 150px;
    }
  </style>
</head>

<body>
  <!-- 原始尺寸 = 样式尺寸 * DPR
    原始尺寸是拍出来的或者UI做图做出来的尺寸
    样式尺寸是设置css的尺寸
  占位 -->

  <!-- 原始尺寸150 -->
  <!-- <img src="https://picsum.photos/id/93/450" alt=""> -->


  <!-- 改动原始尺寸和样式尺寸, 保证等式成立就可以保证清晰度 -->


  <!-- 样式尺寸固定
    srcset写多个值, set集合
    字符串格式, 逗号隔开, 几x是指定DPR是几则匹配哪个
  占位 -->
  <img srcset="
    https://picsum.photos/id/93/150 150w 1x,
    https://picsum.photos/id/93/300 300w 2x,
    https://picsum.photos/id/93/450 450w 3x,
    https://picsum.photos/id/93/750 750w 5x,
    https://picsum.photos/id/93/900 900w 6x,
    https://picsum.photos/id/93/1500 1500w 10x,
  " alt="">

  <div>
    <!-- 浏览器可缩放, 操作系统也可以缩放 -->
    <button onclick="console.log(window.devicePixelRatio);">打印DPR</button>
  </div>

</body>

</html>
