<!doctype html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>磨砂玻璃</title>
  <link rel="stylesheet" href="../../common/mtr.css">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(to right,
          #860a95 0%,
          var(--kowloon-bay) 25%,
          var(--po-lam) 75%,
          var(--sai-wan-ho) 100%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    h1 {
      color: #fff;
    }

    .wrap {
      position: relative;
    }

    .modal {
      width: 120px;
      height: 120px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      position: absolute;
      transform: translate(-50%, -50%);
      top: 50%;
      left: 50%;
      background: rgba(255, 255, 255, 0.4);
      /* filter: blur(3px); */
      backdrop-filter: blur(3px);
    }
  </style>
</head>

<body>

  <div class="wrap">
    <h1>磨砂玻璃效果</h1>
    <div class="modal">Card</div>
  </div>

</body>

</html>
