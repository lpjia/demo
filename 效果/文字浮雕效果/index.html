<!doctype html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>文字浮雕效果</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      /* 背景渐变不能用background-color, 得用background */
      background: linear-gradient(45deg, #bfbfbf, #e6e6e6);
      padding-top: 20vh;
    }

    .wen_zi {
      font-family: 'Luckiest Guy';
      font-size: 20vmin;
      line-height: 1;
      margin: 0;
      letter-spacing: 5px;
      color: #e6e6e6;
      text-align: center;
      text-shadow: 1px -1px #fff, 2px -2px #fff, -1px 1px #999, -2px 2px #999;
      /* 右下都为正 */
    }
  </style>
</head>

<body>

  <!-- 漂亮的文字阴影 文字浮雕效果 -->
  <div class="wen_zi">shadow</div>
  <div class="wen_zi">text</div>
  <div class="wen_zi">effect</div>

</body>

</html>
