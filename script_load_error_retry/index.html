  <title>脚本加载失败如何重试</title>
  <!-- 3. 使用事件委托, 前置到head

  <!-- 4. 使用事件委托, 前置到head, 在捕获阶段
    事件正常触发
    捕获的错误范围很大
      脚本加载的错误 Event类型
      包括js运行中的代码错误
    比如 throw new Error('222') , console.log('error:', e)会多次打印
      throw new Error('222')是ErrorEvent类型
    限定错误范围, 这里只处理脚本的错误
  -->
  <script>
    const backupDomainArr = [
      '124585345.com',
      '@$%$&*&%$.com',
      'backup.com',
    ]
    let index = 0
    const nextDomain = {} // 映射表
    /* {
      '/js/1.js'  0
    } */

    window.addEventListener('error', (e) => {
      if (e instanceof ErrorEvent || e.target.tagName !== 'SCRIPT') {
        return;
      }
      const url = new URL(e.target.src)
      const pathname = url.pathname
      // 先判断没有的
      if (!nextDomain[pathname]) {
        // 给不同的pathname加各自的映射关系, 没有则赋值0
        nextDomain[pathname] = 0
      }
      const index = nextDomain[pathname]
      // 终止条件, 如果已经越界了
      if (index >= backupDomainArr.length) {
        return;
      }
      const domain = backupDomainArr[index]
      url.hostname = domain // 改url的hostname
      const newUrl = url.toString() // 得到新的url, 是字符串
      // 创建新的script, 加到原始script之前
      const script = document.createElement('script')
      script.src = newUrl
      e.target.parentElement.insertBefore(script, e.target) // e.target的父元素里面, 添加到e.target的前面, 也就是增加一个兄弟元素
      nextDomain[pathname]++ // 继续增加index
    }, true)
  </script>

</head>

<body>

  <!-- 不能运行, 就看代码 -->
