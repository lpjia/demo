  <script>
    function getElement(selector) {
      const dom = document.querySelector(selector)
      if (!dom) {
        return null;
      }

      const proxy = new Proxy(dom, {
        get(target, prop, receiver) {
          // 非wait开头的属性, 按正常的来
          if (!prop.startsWith('wait')) {
            return target[prop]
          }
          // wait开头的属性, 按要求的来
          const eventType = prop.substring(4).toLowerCase()
          return new Promise((resolve) => {
            target.addEventListener(eventType, resolve, {
              once: true
            })
          })
        }
      })

      return proxy
    }

    /* js不常见, 传统的强类型语言常见, 优点是不会有回调 */

    /* await 表达式
    await 总会同步地对表达式求值并处理，处理的行为与 Promise.resolve() 一致。
    若表达式的值不是Promise, await会把该值转换为已兑现的Promise, 然后返回其结果。
    Promise.resolve(value)就是对value的包装, 满足期望返回一个promise。 */
